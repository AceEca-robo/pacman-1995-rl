# Double + Dueling DQN, n-step (agents/dqn.py, scripts/train.py).
# All step counts are env steps summed over the vector envs.
total_steps: 5000000
num_envs: 4                 # vector env copies
vector_env: sync            # sync: SyncVectorEnv (deterministic); async: AsyncVectorEnv, one process per copy, shared memory
async_learner: false        # gradient steps in a thread next to acting (scripts/train.py BackgroundLearner); not deterministic
async_max_lag: 4            # async_learner: acting waits while more updates than this are pending
fast_learner: false         # async_learner runs: online(s') in a no-grad pass, cudnn.benchmark, bf16 acting forward passes
learner_process: false      # the learner in its own process, replay frames in shared memory (agents/learner_proc.py, agents/shared_replay.py); not deterministic
                            # vector_env "pool" (learner_process only): agents/env_pool.py, envs step without a barrier
pool_min_ready: null        # pool: results to wait for per actor batch; null = num_envs / 2
weight_sync_every: 50       # learner_process: updates between pushes of the online weights to the actor
replay_guard: 1024          # learner_process: free slots kept ahead of each env's writer (< buffer_size / num_envs)
cpu_affinity: null          # {actor: [cpus], learner: [cpus], envs: [cpus]} (os.sched_setaffinity); null = off
env_config: null            # null = configs/env_default.yaml

buffer_size: 500000
batch_size: 64
n_step: 3
gamma: 0.99
lr: 0.0001
adam_eps: 0.00015
grad_clip: 10.0
learning_starts: 20000      # env steps before the first update
train_every: 16             # env steps per gradient step
target_update: 10000        # env steps between target network syncs
bf16: true                  # autocast forward passes to bfloat16 (CUDA only)
compile: true               # torch.compile the loss (~25 s at start)

# Heuristic agent (agents/heuristic_agent.py) plays this many env steps to
# fill the buffer before training; they do not count towards total_steps,
# epsilon/beta schedules or learning_starts. 0 = off.
warm_start: 0
warm_start_agent_config: null   # null = configs/heuristic.yaml
warm_start_agent: heuristic     # or a BC checkpoint (scripts/train_bc.py), which then plays greedily

# Start from a BC network's convolutions (agents/bc.py, the same network
# config); the rest of the Q network starts fresh. null = off.
init_conv_from: null
freeze_conv_steps: 0        # keep those convolutions fixed for this many env steps

# DQfD (Hester et al. 2018; learner_process only): demo transitions of a BC
# agent in the replay for good, phase 0 = pretrain_updates updates on them
# alone, then RL; loss = lambda_nstep * n-step TD + lambda_1step * 1-step TD
# + lambda_margin * large-margin (demo samples only) + L2 (configs/dqfd.yaml).
dqfd:
  enabled: false

# Prioritized replay, proportional variant.
per:
  enabled: false
  alpha: 0.6
  beta_start: 0.4
  beta_end: 1.0
  beta_steps: null          # env steps of linear beta annealing; null = total_steps
  eps: 0.000001             # added to |TD| so no transition gets priority 0

epsilon_start: 1.0
epsilon_end: 0.05
epsilon_steps: 1000000      # linear decay

network:
  conv_channels: [32, 64, 64]
  conv_kernels: [3, 3, 3]
  conv_strides: [1, 2, 2]   # 23x33 -> 12x17 -> 6x9 (64*6*9 = 3456 into the 512 layer)
  vec_hidden: 64
  hidden: 512

eval_every: 250000
eval_episodes: 20
eval_seed: 1000             # eval episode i uses env seed eval_seed + i (1000..1019: kept apart from the final evaluation on 0..99)
eval_levels: null           # e.g. [1, 2, 3, 4]: also eval_level_episodes games started on each of these mazes (same seeds), stopped once the maze is cleared; eval/maze<N>_cleared
eval_level_episodes: null   # null = eval_episodes
eval_level_max_steps: null  # cut the per-maze eval games after this many ticks; null = eval_max_episode_steps
eval_envs: null             # eval games played in parallel; null = num_envs
best_metric: level1_cleared # rule since v0.2: share of eval games clearing level 1, ties by mean food; or levels_cleared (v0.3), levels_cleared_min_maze, mean_reward (dqn4..dqn10), median_reward (dqn0..dqn3b), median_score
checkpoint_buffer: true     # save the replay buffer with checkpoints (~3.3 GB)
log_every: 10000            # env steps between scalar logs

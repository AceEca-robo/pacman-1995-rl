# Double + Dueling DQN, n-step (agents/dqn.py, scripts/train.py).
# All step counts are env steps summed over the vector envs.
total_steps: 5000000
num_envs: 4                 # SyncVectorEnv copies
env_config: null            # null = configs/env_default.yaml

buffer_size: 500000
batch_size: 64
n_step: 3
gamma: 0.99
lr: 0.0001
adam_eps: 0.00015
grad_clip: 10.0
learning_starts: 20000      # env steps before the first update
train_every: 16             # env steps per gradient step
target_update: 10000        # env steps between target network syncs
bf16: true                  # autocast forward passes to bfloat16 (CUDA only)
compile: true               # torch.compile the loss (~25 s at start)

# Heuristic agent (agents/heuristic_agent.py) plays this many env steps to
# fill the buffer before training; they do not count towards total_steps,
# epsilon/beta schedules or learning_starts. 0 = off.
warm_start: 0
warm_start_agent_config: null   # null = configs/heuristic.yaml

# Prioritized replay, proportional variant.
per:
  enabled: false
  alpha: 0.6
  beta_start: 0.4
  beta_end: 1.0
  beta_steps: null          # env steps of linear beta annealing; null = total_steps
  eps: 0.000001             # added to |TD| so no transition gets priority 0

epsilon_start: 1.0
epsilon_end: 0.05
epsilon_steps: 1000000      # linear decay

network:
  conv_channels: [32, 64, 64]
  conv_kernels: [3, 3, 3]
  conv_strides: [1, 2, 2]   # 23x33 -> 12x17 -> 6x9 (64*6*9 = 3456 into the 512 layer)
  vec_hidden: 64
  hidden: 512

eval_every: 250000
eval_episodes: 20
eval_seed: 1000000          # eval episode i uses env seed eval_seed + i
best_metric: mean_reward    # mean eval reward; or median_reward (dqn0..dqn3b used it), median_score
checkpoint_buffer: true     # save the replay buffer with checkpoints (~3.3 GB)
log_every: 10000            # env steps between scalar logs

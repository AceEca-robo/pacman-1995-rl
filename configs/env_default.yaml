# PacmanEnv (env/pacman_env.py) defaults.
# Reward per step = sum over events of coefficient * count (env/pacman_env.py
# PacmanEnv._events). The game's score is only reported in info["score"].
reward:
  eaten_dot: 1.0
  eaten_energizer: 2.0
  ghost_eaten: 5.0      # fixed, no doubling like the game score
  level_up: 50.0
  death: -20.0          # per life lost, the final one included
  bonus_eaten: 0.0      # bonus points/life item; not rewarded for now
  step: -0.02

# Potential-based shaping (Ng et al. 1999), added to the reward:
# r += gamma * Phi(s') - Phi(s), Phi(s) = k_dist * (D_max - d), d = BFS
# distance from pacman to the nearest dot or energizer (walls and the gate
# block), D_max = largest such distance in any of the 16 mazes (86).
# Phi = 0 with no food left and in terminal states. Phi >= 0, so standing
# still costs (gamma - 1) * Phi on top of the step penalty.
# Reported per step in info["shaping"].
shaping:
  enabled: false
  k_dist: 0.1
  gamma: 0.99           # should match the agent's discount

# 5: U/D/L/R/N (N keeps the direction); 4: U/D/L/R only.
actions: 5

# End the episode after this many steps without eating a dot or an
# energizer, with the death reward (reward.death); info["hunger"] = True.
# 0 = off.
hunger_limit: 0
# "terminate" (as before): the hunger limit ends the episode like a death,
# with reward.death; "truncate": truncated=True without a penalty (a time
# limit: the value bootstraps), info["hunger"] = True either way.
hunger_mode: terminate

# Optional observation parts (off: the observation is as for dqn0..dqn4).
obs:
  food_distance: false    # grid channel 21: BFS steps to the nearest food / D_max (86)
  steps_since_food: false # vec[3]: steps since the last dot/energizer / 200, clipped to 1
  # last grid channel: 1 on each cell pacman reaches (BFS; walls and the gate
  # block) strictly before every normal ghost (BFS from all of them; only
  # walls block, ghosts use the gate both ways), else 0; while supertime > 0
  # every cell pacman can reach is 1. Not for checkpoints trained without it.
  cell_safety: false
  # grid channel after cell_safety: on pacman's cell and every cell within 6
  # BFS steps of it, the number of directions out of the cell with a path of
  # >= 8 cell-safe cells (not back through the cell) / 4; 0 elsewhere and on
  # unsafe cells (env/pacman_env.py safe_exits_field). Computed from the
  # cell-safety plane (also when cell_safety itself is off).
  safe_exits: false

# false: the ghosts never leave their house (game --no-ghosts), so pacman
# cannot die. Diagnostics only.
ghosts: true

# Dots get more valuable as the board empties: a dot eaten with n food items
# (dots + energizers) left afterwards is worth reward.eaten_dot * (1 + k / max(n, 1)).
# The extra part is in info["endgame_bonus"]. Off by default.
endgame_dot:
  enabled: false
  k: 20

# Endgame curriculum: with this probability a reset replays a recorded
# opening from prefix_file (tools/record_prefixes.py: heuristic play until
# <= 15 food left on the prefix's level, no life lost) and starts the episode there.
# info["prefix"] = the replayed game's seed, -1 without. 0 = off; evaluation never uses it.
prefix_prob: 0.0
prefix_file: data/endgame_prefixes.json
# Several prefix files instead of prefix_file: [{file: ..., weight: ...}, ..];
# a prefix reset picks a file by weight, then a prefix uniformly in it.
# Prefixes may carry "start_level" (the game's start level, default
# "level"), "lives" (default 3) and pacman/ghost cells at their end
# (tools/record_death_prefixes.py); the replay checks them. An entry with
# before_death: [lo, hi] cuts each death prefix back to a uniform lo..hi
# ticks before its death, at most its "life_tick" (ticks the death's life
# had lasted; tools/escape_demos.py writes such a file); only the level and
# the lives are checked then.
prefix_mix: null

# Level the game starts on (game --level): an int (1 = the original game),
# or "random:a-b" for a level drawn uniformly from a..b at every reset (a new
# game process when the level changes). Levels 1..16 are the 16 mazes; after
# a game over the game restarts on the same level. Overridable per reset
# with reset(options={"start_level": ...}). A prefix replay starts the game on
# the prefix's own level (its "level" field, 1 if missing).
start_level: 1

# Steps (game ticks) before truncated=True; null = no limit.
max_episode_steps: 10000

game:
  binary: game/pacman   # relative to the repo root
  connect_timeout: 10.0 # seconds to wait for the game to connect

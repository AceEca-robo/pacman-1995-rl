# PacmanEnv (env/pacman_env.py) defaults.
# Reward per step = sum over events of coefficient * count (env/pacman_env.py
# PacmanEnv._events). The game's score is only reported in info["score"].
reward:
  eaten_dot: 1.0
  eaten_energizer: 2.0
  ghost_eaten: 5.0      # fixed, no doubling like the game score
  level_up: 50.0
  death: -20.0          # per life lost, the final one included
  bonus_eaten: 0.0      # bonus points/life item; not rewarded for now
  step: -0.02

# Steps (game ticks) before truncated=True; null = no limit.
max_episode_steps: 10000

game:
  binary: game/pacman   # relative to the repo root
  connect_timeout: 10.0 # seconds to wait for the game to connect

# PacmanEnv (env/pacman_env.py) defaults.
# Reward per step = sum over events of coefficient * count (env/pacman_env.py
# PacmanEnv._events). The game's score is only reported in info["score"].
reward:
  eaten_dot: 1.0
  eaten_energizer: 2.0
  ghost_eaten: 5.0      # fixed, no doubling like the game score
  level_up: 50.0
  death: -20.0          # per life lost, the final one included
  bonus_eaten: 0.0      # bonus points/life item; not rewarded for now
  step: -0.02

# Potential-based shaping (Ng et al. 1999), added to the reward:
# r += gamma * Phi(s') - Phi(s), Phi(s) = k_dist * (D_max - d), d = BFS
# distance from pacman to the nearest dot or energizer (walls and the gate
# block), D_max = largest such distance in any of the 16 mazes (86).
# Phi = 0 with no food left and in terminal states. Phi >= 0, so standing
# still costs (gamma - 1) * Phi on top of the step penalty.
# Reported per step in info["shaping"].
shaping:
  enabled: false
  k_dist: 0.1
  gamma: 0.99           # should match the agent's discount

# 5: U/D/L/R/N (N keeps the direction); 4: U/D/L/R only.
actions: 5

# End the episode after this many steps without eating a dot or an
# energizer, with the death reward (reward.death); info["hunger"] = True.
# 0 = off.
hunger_limit: 0

# Optional observation parts (off: the observation is as for dqn0..dqn4).
obs:
  food_distance: false    # grid channel 21: BFS steps to the nearest food / D_max (86)
  steps_since_food: false # vec[3]: steps since the last dot/energizer / 200, clipped to 1

# false: the ghosts never leave their house (game --no-ghosts), so pacman
# cannot die. Diagnostics only.
ghosts: true

# Dots get more valuable as the board empties: a dot eaten with n food items
# (dots + energizers) left afterwards is worth reward.eaten_dot * (1 + k / max(n, 1)).
# The extra part is in info["endgame_bonus"]. Off by default.
endgame_dot:
  enabled: false
  k: 20

# Endgame curriculum: with this probability a reset replays a recorded
# opening from prefix_file (tools/record_prefixes.py: heuristic play until
# <= 15 food left on level 1, no life lost) and starts the episode there.
# info["prefix"] = the replayed game's seed. 0 = off; evaluation never uses it.
prefix_prob: 0.0
prefix_file: data/endgame_prefixes.json

# Steps (game ticks) before truncated=True; null = no limit.
max_episode_steps: 10000

game:
  binary: game/pacman   # relative to the repo root
  connect_timeout: 10.0 # seconds to wait for the game to connect
